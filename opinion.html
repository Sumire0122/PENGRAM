<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | PENGRAM</title>
  <meta name="description" content="PENGRAMへのお問い合わせはこちらから。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a class="header-logo" href="index.html"><img src="images/logo.png" alt="PENGRAM Code. Think. Chill." width="253" height="127"></a>
    <nav class="header-nav" aria-label="グローバルナビ">
      <ul>
        <li><a href="info.html">スクールについて</a></li>
        <li><a href="fee.html">コース・料金</a></li>
        <li><a href="opinion.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <main class="main">
    <section class="panel">
      <h1 class="panel-title"><img src="images/icon.png" alt="" width="64" height="51">お問い合わせ</h1>
      <div class="panel-body">
        <p>スクール見学や各コースについてのご質問、ご意見・ご要望などを受け付けています。<br>
        下記フォームに必要事項をご入力のうえ、お問い合わせください。</p>

        <form class="form" action="#" method="post">
          <label class="form-label" for="name">お名前</label>
          <input class="form-input" type="text" id="name" name="name" autocomplete="name">

          <label class="form-label" for="message">ご意見・ご要望</label>
          <textarea class="form-textarea" id="message" name="message"></textarea>

          <fieldset class="form-group">
            <legend class="form-label">推しペンギン</legend>
            <label class="check"><input type="checkbox" name="penguin" value="div">ディブちゃん</label>
            <label class="check"><input type="checkbox" name="penguin" value="span">スパンちゃん</label>
            <label class="check"><input type="checkbox" name="penguin" value="iframe">アイフレームちゃん</label>
          </fieldset>

          <button class="form-button" type="submit">送信する</button>
        </form>
      </div>
      <img class="panel-penguin" src="images/penguin.png" alt="ビーチチェアでくつろぐペンギン" width="257" height="343">
    </section>
    <nav class="side-nav" aria-label="ページメニュー">
      <ul>
        <li><a href="info.html">スクールについて</a></li>
        <li><a href="fee.html">コース・料金</a></li>
        <li><a href="opinion.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </main>

  <footer class="footer">
    <small>&copy; 2026 PENGRAM. All Rights Reserved.</small>
  </footer>
</body>
</html>
